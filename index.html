<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>Mafia LAN Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { background:#020617; color:#e2e8f0; font-family:'Segoe UI', Tahoma, 'Noto Naskh Arabic', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { min-height:100vh; min-height:100dvh; padding-bottom: env(safe-area-inset-bottom); }
  @keyframes shrink { from { width:100%; } to { width:0%; } }
  @keyframes pop { from { transform:scale(.92); opacity:0; } to { transform:scale(1); opacity:1; } }
  .pop { animation: pop .25s ease-out; }
  button { touch-action: manipulation; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .glow-night { background: radial-gradient(ellipse at top, #1e1b4b 0%, #020617 60%); }
  .glow-day { background: radial-gradient(ellipse at top, #78350f 0%, #020617 65%); }
  .glow-home { background: radial-gradient(ellipse at top, #450a0a 0%, #020617 60%); }
</style>
</head>
<body>
<noscript><p style="padding:2rem;text-align:center">يلزم تفعيل JavaScript لتشغيل اللعبة.</p></noscript>
<div id="root" class="min-h-screen"><div id="app" class="max-w-md mx-auto p-4"></div></div>

<script>
(() => {
'use strict';

/* ======================================================================
   الثوابت
   ====================================================================== */
const ROLES = {
  mafia:     { n:'مافيا',      e:'🦹‍♂️', c:'text-red-400',     d:'اقتل لاعباً كل ليلة وتجنّب الانكشاف. تفوز عندما يتساوى عددكم مع بقية اللاعبين.', hint:'🦹‍♂️ اختر ضحيتك لهذه الليلة' },
  doctor:    { n:'طبيب',       e:'👨‍⚕️', c:'text-emerald-400', d:'احمِ لاعباً واحداً كل ليلة من القتل (يمكنك حماية نفسك).', hint:'👨‍⚕️ اختر من تريد حمايته' },
  detective: { n:'محقق',       e:'🕵️',   c:'text-sky-400',     d:'حقّق في لاعب كل ليلة لتعرف هل هو مافيا. تُحفظ نتائجك في دفتر التحقيقات.', hint:'🕵️ اختر من تريد التحقيق فيه' },
  civilian:  { n:'مدني بريء',  e:'🧑‍🌾', c:'text-amber-300',   d:'ابحث عن المافيا وصوّت لإقصائهم نهاراً. ليلاً اضغط على أي لاعب كتمويه.', hint:'🧑‍🌾 تمويه: اختر أي لاعب (لا تأثير لاختيارك)' }
};
const PHASE_LABEL = { lobby:'الردهة', roles:'توزيع الأدوار', night:'🌙 الليل', day:'☀️ النهار', vote:'🗳️ التصويت', voteResult:'نتيجة التصويت', gameover:'نهاية اللعبة' };
const BOT_NAMES = ['سامر','ليلى','كريم','هدى','عمر','رنا','زياد','دانة','بسام','مها','فادي','سلمى'];
const MIN_PLAYERS = 4, MAX_PLAYERS = 16;

const CARD  = 'bg-slate-900/80 border border-slate-800 rounded-2xl p-4 mb-3';
const BTN_P = 'w-full py-3.5 rounded-xl font-bold text-lg bg-red-600 hover:bg-red-500 active:scale-[.98] transition text-white';
const BTN_S = 'w-full py-3 rounded-xl font-bold bg-slate-800 hover:bg-slate-700 active:scale-[.98] transition text-slate-100';
const BTN_G = 'w-full py-3.5 rounded-xl font-bold text-lg bg-emerald-600 hover:bg-emerald-500 active:scale-[.98] transition text-white';

/* ======================================================================
   أدوات عامة
   ====================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = n => Math.floor(Math.random() * n);
const pick = arr => arr[rnd(arr.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cleanName = s => String(s || '').replace(/\s+/g, ' ').trim().slice(0, 14);
const rndCode = () => String(1000 + rnd(9000));
const lsGet = (k, d = '') => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };

function makePid() {
  let id = lsGet('mafia_pid');
  if (!id) {
    id = (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36) + Date.now().toString(36)).replace(/[^a-zA-Z0-9]/g, '').slice(0, 16);
    lsSet('mafia_pid', id);
  }
  return id;
}
const pid = makePid();

/* ======================================================================
   المؤثرات الصوتية (Web Audio API - بدون ملفات خارجية)
   ====================================================================== */
let actx = null;
let muted = lsGet('mafia_mute') === '1';
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, t0, dur, type = 'sine', vol = 0.15) {
  const a = ac(); if (!a || muted) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  const s = a.currentTime + t0;
  g.gain.setValueAtTime(0.0001, s);
  g.gain.exponentialRampToValueAtTime(vol, s + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
  o.connect(g); g.connect(a.destination);
  o.start(s); o.stop(s + dur + 0.05);
}
const SFX = {
  click()  { tone(660, 0, .08, 'triangle', .12); },
  select() { tone(520, 0, .06, 'triangle', .1); },
  reveal() { [392, 523, 659, 784].forEach((f, i) => tone(f, i * .09, .18, 'triangle', .13)); },
  night()  { [440, 349, 294, 220].forEach((f, i) => tone(f, i * .22, .5, 'sine', .14)); },
  day()    { [262, 330, 392, 523].forEach((f, i) => tone(f, i * .16, .4, 'triangle', .14)); },
  kill()   { tone(110, 0, .5, 'sawtooth', .16); tone(82, .15, .6, 'sawtooth', .14); },
  vote()   { tone(880, 0, .07, 'square', .08); tone(880, .12, .07, 'square', .08); },
  win()    { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * .14, .3, 'triangle', .15)); },
  lose()   { [392, 330, 262, 196].forEach((f, i) => tone(f, i * .25, .5, 'sawtooth', .1)); }
};
function sfx(name) { try { SFX[name] && SFX[name](); } catch (e) {} }

/* ======================================================================
   الحالة العامة
   ====================================================================== */
let S = null; // حالة اللعبة المتزامنة
const ui = {
  name: lsGet('mafia_name'),
  code: '',
  conn: 'off',          // off | connecting | on
  hostOnline: true,
  sel: null,            // الهدف المختار محلياً
  revealUntil: 0,       // زمن انتهاء كشف الدور
  notebook: false,
  toast: '',
  joined: false,
  lastKey: ''
};
const net = { ws: null, code: null, host: false, closed: true, retry: 0, timer: null, ping: null, watch: null, tries: 0 };

const meOf = () => (S && S.players.find(p => p.id === pid)) || null;
const isHost = () => !!(net.host && S && S.hostId === pid);

function toast(t) {
  ui.toast = t; render();
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { ui.toast = ''; render(); }, 3200);
}

/* ======================================================================
   الشبكة (WebSocket)
   ====================================================================== */
function wsUrl(code, host) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  return `${proto}://${location.host}/ws/${code}?pid=${encodeURIComponent(pid)}&host=${host ? 1 : 0}`;
}
function send(obj) {
  if (net.ws && net.ws.readyState === 1) { try { net.ws.send(JSON.stringify(obj)); } catch (e) {} }
}
function saveSession() { lsSet('mafia_session', JSON.stringify({ code: net.code, host: net.host })); }

function connect(code, host) {
  net.code = code; net.host = host; net.closed = false; net.retry = 0;
  saveSession();
  openSocket();
}
function openSocket() {
  clearTimeout(net.timer);
  let ws;
  try { ws = new WebSocket(wsUrl(net.code, net.host)); }
  catch (e) { scheduleRetry(); return; }
  net.ws = ws; ui.conn = 'connecting'; render();

  ws.onopen = () => {
    if (net.ws !== ws) return;
    net.retry = 0; ui.conn = 'on';
    clearInterval(net.ping);
    net.ping = setInterval(() => send({ type: 'PING' }), 25000);
    if (net.host) {
      if (S) send({ type: 'STATE_UPDATE', state: S }); // إعادة زرع الحالة إن فُقدت من السيرفر
    } else {
      send({ type: 'PLAYER_JOIN_REQUEST', name: cleanName(ui.name) });
    }
    startWatch();
    render();
  };
  ws.onmessage = ev => {
    if (net.ws !== ws) return;
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m && typeof m === 'object') onMsg(m);
  };
  ws.onclose = () => {
    if (net.ws !== ws) return;
    clearInterval(net.ping);
    ui.conn = 'off'; render();
    if (!net.closed) scheduleRetry();
  };
  ws.onerror = () => {};
}
function scheduleRetry() {
  clearTimeout(net.timer);
  net.retry++;
  net.timer = setTimeout(() => { if (!net.closed) openSocket(); }, Math.min(1000 * net.retry, 8000));
}
function startWatch() {
  clearTimeout(net.watch);
  if (net.host && S) return;
  net.watch = setTimeout(() => {
    if (net.closed) return;
    if (!S) return failJoin(net.host ? 'انتهت الغرفة أو أُعيد تشغيل السيرفر' : 'الغرفة غير موجودة أو الهوست غير متصل');
    if (!net.host && !S.players.some(p => p.id === pid)) {
      failJoin(S.phase !== 'lobby' ? 'اللعبة بدأت بالفعل في هذه الغرفة' : 'لم يردّ الهوست على طلب الانضمام');
    }
  }, 7000);
}
function failJoin(msg) { leaveRoom(); toast(msg); }

function leaveRoom() {
  net.closed = true;
  clearTimeout(net.timer); clearTimeout(net.watch); clearInterval(net.ping);
  const ws = net.ws; net.ws = null;
  if (ws) { try { ws.close(); } catch (e) {} }
  S = null; ui.joined = false; ui.sel = null; ui.revealUntil = 0; ui.notebook = false; ui.conn = 'off'; ui.lastKey = '';
  lsDel('mafia_session');
  render();
}

function onMsg(m) {
  switch (m.type) {
    case 'SYNC_STATE': onSync(m.state); break;
    case 'HOST_STATUS': ui.hostOnline = !!m.online; render(); break;
    case 'PLAYER_JOIN_REQUEST': if (isHost()) hostJoin(m.pid, m.name); break;
    case 'PLAYER_ACTION': if (isHost()) handleAction(m.pid, m); break;
    case 'ROOM_CLOSED': leaveRoom(); toast('أنهى الهوست الغرفة'); break;
    case 'ERROR':
      if (m.code === 'ROOM_TAKEN' && net.host && S) {
        const old = net.ws; net.ws = null; try { old && old.close(); } catch (e) {}
        if (net.tries < 6) { net.tries++; S.code = rndCode(); connect(S.code, true); }
        else { leaveRoom(); toast('تعذّر إنشاء غرفة، حاول مجدداً'); }
      } else if (m.code === 'BAD_ROOM') { leaveRoom(); toast('كود الغرفة غير صالح'); }
      break;
  }
}

function onSync(st) {
  if (!st) return; // لا توجد حالة بعد
  if (net.host) {
    if (!S || (st.v || 0) > (S.v || 0)) S = st;
  } else {
    S = st;
    if (S.players.some(p => p.id === pid)) ui.joined = true;
    else if (ui.joined) { leaveRoom(); toast('تم إخراجك من الغرفة'); return; }
    else if (S.phase !== 'lobby') { failJoin('اللعبة بدأت بالفعل في هذه الغرفة'); return; }
  }
  stateChanged();
}

function stateChanged() {
  const key = S ? S.phase + ':' + S.round : '';
  if (key !== ui.lastKey) {
    const first = ui.lastKey === '';
    ui.lastKey = key; ui.sel = null; ui.revealUntil = 0;
    if (!first) phaseSfx();
  }
  render();
}
function phaseSfx() {
  if (!S) return;
  const me = meOf();
  switch (S.phase) {
    case 'roles': sfx('reveal'); break;
    case 'night': sfx('night'); break;
    case 'day': sfx(S.lastNight && S.lastNight.killed ? 'kill' : 'day'); break;
    case 'vote': sfx('vote'); break;
    case 'voteResult': sfx(S.voteResult && S.voteResult.eliminated ? 'kill' : 'click'); break;
    case 'gameover': {
      const mine = me && me.role === 'mafia' ? 'mafia' : 'civilians';
      sfx(S.winner === mine ? 'win' : 'lose'); break;
    }
  }
}

/* ======================================================================
   منطق اللعبة (يعمل على جهاز الهوست فقط)
   ====================================================================== */
function newState(code, hostName) {
  return {
    v: 0, code, hostId: pid, phase: 'lobby', round: 0,
    players: [{ id: pid, name: hostName, role: null, alive: true, isBot: false }],
    night: { done: [] }, votes: { done: [] },
    announce: '', lastNight: null, voteResult: null, winner: null,
    notes: {}, _host: { nightActions: {}, votes: {} }
  };
}
function commit() {
  if (!S) return;
  S.v = (S.v || 0) + 1;
  send({ type: 'STATE_UPDATE', state: S });
  stateChanged();
}
const alivePlayers = () => S.players.filter(p => p.alive);

function hostJoin(id, name) {
  if (!S || S.phase !== 'lobby' || !id) return;
  name = cleanName(name) || 'لاعب';
  const existing = S.players.find(p => p.id === id);
  if (existing) { commit(); return; }
  if (S.players.length >= MAX_PLAYERS) return;
  let final = name, i = 2;
  while (S.players.some(p => p.name === final)) final = name + ' ' + (i++);
  S.players.push({ id, name: final, role: null, alive: true, isBot: false });
  commit();
}
function addBotRaw() {
  if (S.players.length >= MAX_PLAYERS) return false;
  const used = S.players.map(p => p.name);
  const free = BOT_NAMES.filter(n => !used.includes('🤖 ' + n));
  const name = '🤖 ' + (free.length ? pick(free) : 'بوت' + (S.players.length + 1));
  S.players.push({ id: 'bot' + Date.now().toString(36) + rnd(1e4), name, role: null, alive: true, isBot: true });
  return true;
}
function assignRoles() {
  const n = S.players.length;
  const m = Math.max(1, Math.floor(n / 4));
  const roles = [];
  for (let i = 0; i < m; i++) roles.push('mafia');
  roles.push('doctor'); roles.push('detective');
  while (roles.length < n) roles.push('civilian');
  const sh = shuffle(roles);
  S.players.forEach((p, i) => { p.role = sh[i]; p.alive = true; });
}
function startGameRaw() {
  if (S.players.length < MIN_PLAYERS) return false;
  assignRoles();
  S.phase = 'roles'; S.round = 0; S.notes = {}; S.winner = null;
  S.announce = ''; S.lastNight = null; S.voteResult = null;
  S.night = { done: [] }; S.votes = { done: [] };
  S._host = { nightActions: {}, votes: {} };
  return true;
}
function checkWin() {
  const a = alivePlayers();
  const m = a.filter(p => p.role === 'mafia').length;
  const o = a.length - m;
  if (m === 0) return 'civilians';
  if (m >= o) return 'mafia';
  return null;
}

/* ---------- الليل ---------- */
function beginNight() {
  S.round += 1; S.phase = 'night';
  S.night = { done: [] }; S._host.nightActions = {};
  botNight();
  if (alivePlayers().every(p => S.night.done.includes(p.id))) resolveNight(); else commit();
}
function botNight() {
  const alive = alivePlayers();
  alive.filter(p => p.isBot).forEach(b => {
    let target;
    if (b.role === 'mafia') target = pick(alive.filter(p => p.role !== 'mafia'));
    else if (b.role === 'doctor') target = pick(alive);
    else if (b.role === 'detective') {
      const done = (S.notes[b.id] || []).map(x => x.id);
      const opts = alive.filter(p => p.id !== b.id && !done.includes(p.id));
      target = pick(opts.length ? opts : alive.filter(p => p.id !== b.id));
    } else target = pick(alive.filter(p => p.id !== b.id));
    if (target) { S._host.nightActions[b.id] = { target: target.id }; S.night.done.push(b.id); }
  });
}
function resolveNight() {
  const alive = alivePlayers();
  const A = S._host.nightActions;
  const tally = {};
  alive.filter(p => p.role === 'mafia').forEach(p => { const a = A[p.id]; if (a) tally[a.target] = (tally[a.target] || 0) + 1; });
  let target = null;
  const max = Math.max(0, ...Object.values(tally));
  if (max > 0) target = pick(Object.keys(tally).filter(k => tally[k] === max));
  const doc = alive.find(p => p.role === 'doctor');
  const protect = doc && A[doc.id] ? A[doc.id].target : null;
  let killed = null;
  if (target && target !== protect) {
    const v = S.players.find(p => p.id === target);
    if (v) { v.alive = false; killed = v.id; }
  }
  const det = alive.find(p => p.role === 'detective');
  if (det && A[det.id]) {
    const t = S.players.find(p => p.id === A[det.id].target);
    if (t) { (S.notes[det.id] = S.notes[det.id] || []).push({ round: S.round, id: t.id, name: t.name, isMafia: t.role === 'mafia' }); }
  }
  S.lastNight = { killed, round: S.round };
  if (killed) {
    const v = S.players.find(p => p.id === killed);
    S.announce = `💀 قُتل ${v.name} هذه الليلة. كان دوره: ${ROLES[v.role].e} ${ROLES[v.role].n}`;
  } else {
    S.announce = '🌅 مرّت الليلة بسلام ولم يُقتل أحد.';
  }
  const w = checkWin();
  if (w) { S.winner = w; S.phase = 'gameover'; } else S.phase = 'day';
  commit();
}

/* ---------- التصويت ---------- */
function beginVote() {
  S.phase = 'vote'; S.votes = { done: [] }; S._host.votes = {};
  botVote();
  if (alivePlayers().every(p => S.votes.done.includes(p.id))) resolveVote(); else commit();
}
function botVote() {
  const alive = alivePlayers();
  alive.filter(p => p.isBot).forEach(b => {
    let v;
    if (rnd(100) < 15) v = 'abstain';
    else {
      const known = (S.notes[b.id] || []).filter(x => x.isMafia && alive.some(p => p.id === x.id));
      if (b.role === 'detective' && known.length) v = known[0].id;
      else if (b.role === 'mafia') v = pick(alive.filter(p => p.role !== 'mafia')).id;
      else v = pick(alive.filter(p => p.id !== b.id)).id;
    }
    S._host.votes[b.id] = v; S.votes.done.push(b.id);
  });
}
function resolveVote() {
  const alive = alivePlayers();
  const counts = {}; let abstain = 0;
  alive.forEach(p => {
    const v = S._host.votes[p.id];
    if (!v || v === 'abstain') abstain++; else counts[v] = (counts[v] || 0) + 1;
  });
  const max = Math.max(0, ...Object.values(counts));
  const tops = Object.keys(counts).filter(k => counts[k] === max);
  let elim = null;
  if (max > 0 && tops.length === 1 && max > abstain) elim = tops[0];
  if (elim) { const v = S.players.find(p => p.id === elim); v.alive = false; }
  S.voteResult = { counts, abstain, eliminated: elim, round: S.round };
  const w = checkWin();
  if (w) { S.winner = w; S.phase = 'gameover'; } else S.phase = 'voteResult';
  commit();
}

/* ---------- أفعال اللاعبين ---------- */
function handleAction(from, m) {
  if (!S || !from) return;
  const p = S.players.find(x => x.id === from);
  if (!p || !p.alive) return;
  if (m.action === 'night' && S.phase === 'night') {
    if (S.night.done.includes(from)) return;
    const t = S.players.find(x => x.id === m.target);
    if (!t || !t.alive) return;
    if (p.role === 'mafia' && t.role === 'mafia') return;
    if (p.role !== 'doctor' && t.id === from) return;
    S._host.nightActions[from] = { target: t.id };
    S.night.done.push(from);
    if (alivePlayers().every(x => S.night.done.includes(x.id))) resolveNight(); else commit();
  } else if (m.action === 'vote' && S.phase === 'vote') {
    if (S.votes.done.includes(from)) return;
    const t = m.target;
    if (t !== 'abstain') {
      const tp = S.players.find(x => x.id === t);
      if (!tp || !tp.alive || t === from) return;
    }
    S._host.votes[from] = t;
    S.votes.done.push(from);
    if (alivePlayers().every(x => S.votes.done.includes(x.id))) resolveVote(); else commit();
  }
}
function act(action, target) {
  if (isHost()) handleAction(pid, { action, target });
  else send({ type: 'PLAYER_ACTION', action, target });
}

/* ======================================================================
   واجهات العرض
   ====================================================================== */
function render() {
  const app = $('#app'); if (!app) return;
  const root = $('#root');
  let html, bg = 'glow-home';
  if (!S) {
    html = (!net.closed) ? connectingView() : homeView();
  } else {
    html = gameView();
    bg = (S.phase === 'day' || S.phase === 'voteResult') ? 'glow-day' : (S.phase === 'night' ? 'glow-night' : 'glow-home');
  }
  root.className = 'min-h-screen ' + bg;
  app.innerHTML = html + (ui.toast ? `<div class="fixed bottom-6 inset-x-0 flex justify-center px-4 z-50"><div class="pop bg-slate-800 border border-slate-600 text-slate-100 px-4 py-3 rounded-xl shadow-xl text-sm max-w-sm text-center">${esc(ui.toast)}</div></div>` : '');
}

function homeView() {
  const sess = (() => { try { return JSON.parse(lsGet('mafia_session', 'null')); } catch (e) { return null; } })();
  return `
  <div class="pt-8 pb-4 text-center">
    <div class="text-6xl mb-2">🎭</div>
    <h1 class="text-3xl font-black">Mafia LAN Pro</h1>
    <p class="text-slate-400 text-sm mt-1">لعبة مافيا جماعية بالوقت الفعلي</p>
  </div>
  <div class="${CARD}">
    <label class="text-sm text-slate-400">اسمك</label>
    <input id="nameInput" type="text" maxlength="14" value="${esc(ui.name)}" placeholder="اكتب اسمك" autocomplete="off"
      class="w-full mt-1 mb-4 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-lg outline-none focus:border-red-500">
    <label class="text-sm text-slate-400">كود الغرفة (4 أرقام)</label>
    <input id="codeInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" value="${esc(ui.code)}" placeholder="0000" autocomplete="off"
      class="w-full mt-1 mb-4 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-2xl text-center tracking-[.5em] outline-none focus:border-red-500">
    <button data-action="join" class="${BTN_P}">دخول</button>
  </div>
  <div class="${CARD}">
    <button data-action="create" class="${BTN_S} mb-2">➕ إنشاء غرفة جديدة (أنا الهوست)</button>
    <button data-action="demo" class="${BTN_S}">🤖 تجربة سريعة مع البوتات</button>
  </div>
  ${sess && sess.code ? `<button data-action="resume" class="${BTN_G} mb-3">↩️ العودة إلى الغرفة ${esc(sess.code)}</button>` : ''}
  <div class="text-center text-xs text-slate-500 mt-4">
    <button data-action="mute" class="underline">${muted ? '🔇 الصوت متوقف' : '🔊 الصوت يعمل'}</button>
  </div>`;
}

function connectingView() {
  return `
  <div class="pt-24 text-center">
    <div class="text-5xl mb-4 animate-pulse">📡</div>
    <div class="text-lg font-bold">جارٍ الاتصال بالغرفة ${esc(net.code)}…</div>
    <div class="text-slate-400 text-sm mt-2">بانتظار تحديث الحالة من الهوست</div>
    <div class="mt-8"><button data-action="leave" class="${BTN_S}">إلغاء</button></div>
  </div>`;
}

function headerHtml() {
  const dot = ui.conn === 'on' ? 'bg-emerald-400' : 'bg-red-500 animate-pulse';
  return `
  <div class="flex items-center justify-between mb-3 gap-2">
    <div class="flex items-center gap-2">
      <span class="text-xs px-2 py-1 rounded-lg bg-slate-800 font-mono tracking-widest">#${esc(S.code)}</span>
      <span class="w-2.5 h-2.5 rounded-full ${dot}"></span>
    </div>
    <div class="text-sm text-slate-300 font-bold">${PHASE_LABEL[S.phase] || ''}${S.round && S.phase !== 'lobby' ? ` · الجولة ${S.round}` : ''}</div>
    <div class="flex gap-1">
      <button data-action="mute" class="w-9 h-9 rounded-lg bg-slate-800 text-lg">${muted ? '🔇' : '🔊'}</button>
      <button data-action="leave" class="w-9 h-9 rounded-lg bg-slate-800 text-lg" title="مغادرة">🚪</button>
    </div>
  </div>
  ${!ui.hostOnline ? `<div class="mb-3 rounded-xl bg-amber-900/50 border border-amber-700 text-amber-200 text-sm px-3 py-2 text-center">⚠️ الهوست غير متصل حالياً، سيستكمل اللعب عند عودته.</div>` : ''}
  ${ui.conn !== 'on' ? `<div class="mb-3 rounded-xl bg-red-900/40 border border-red-800 text-red-200 text-sm px-3 py-2 text-center">انقطع الاتصال… تتم إعادة المحاولة تلقائياً</div>` : ''}`;
}

function gameView() {
  const me = meOf();
  let body = '';
  switch (S.phase) {
    case 'lobby': body = lobbyView(); break;
    case 'roles': body = rolesView(); break;
    case 'night': body = nightView(); break;
    case 'day': body = dayView(); break;
    case 'vote': body = voteView(); break;
    case 'voteResult': body = voteResultView(); break;
    case 'gameover': body = gameoverView(); break;
  }
  const showCard = S.phase !== 'lobby' && me && me.role;
  return headerHtml() + body + (showCard ? roleCardHtml() : '') + (ui.notebook ? notebookHtml() : '');
}

/* ---------- عناصر مشتركة ---------- */
function playerChip(p) {
  const roleShown = p.role && ROLES[p.role] && (!p.alive || S.phase === 'gameover' || p.id === pid || (meOf() && meOf().role === 'mafia' && p.role === 'mafia'));
  const tag = roleShown ? `<span class="text-xs ${ROLES[p.role].c}">${ROLES[p.role].e} ${ROLES[p.role].n}</span>` : '';
  return `<div class="flex items-center justify-between rounded-xl px-3 py-2 mb-1.5 ${p.alive ? 'bg-slate-800/70' : 'bg-slate-900 opacity-60'}">
    <div class="flex items-center gap-2"><span>${p.alive ? '🟢' : '💀'}</span><span class="${p.alive ? '' : 'line-through'}">${esc(p.name)}${p.id === pid ? ' <span class="text-xs text-slate-400">(أنت)</span>' : ''}${p.id === S.hostId ? ' 👑' : ''}</span></div>
    ${tag}</div>`;
}
const statusList = () => `<div class="${CARD}"><div class="font-bold mb-2 text-sm text-slate-300">اللاعبون (${alivePlayers().length} أحياء من ${S.players.length})</div>${S.players.map(playerChip).join('')}</div>`;

function progressHtml(done, label) {
  const alive = alivePlayers();
  const n = alive.filter(p => done.includes(p.id)).length;
  const pct = alive.length ? Math.round(n / alive.length * 100) : 0;
  return `<div class="${CARD}"><div class="flex justify-between text-sm mb-2"><span>${label}</span><span>${n} / ${alive.length}</span></div>
    <div class="h-2 bg-slate-800 rounded-full overflow-hidden"><div class="h-full bg-red-500 transition-all" style="width:${pct}%"></div></div></div>`;
}
const waitingBox = (txt) => `<div class="${CARD} text-center"><div class="text-4xl mb-2 animate-pulse">⏳</div><div class="font-bold">${txt}</div></div>`;
const spectatorBox = (txt) => `<div class="${CARD} text-center"><div class="text-5xl mb-2">👻</div><div class="font-bold">أنت خارج اللعبة</div><div class="text-slate-400 text-sm mt-1">${txt}</div></div>`;

function pickerHtml(targets, opts) {
  // targets: [{id,name,disabled,abstain}]
  const tiles = targets.map(t => {
    const sel = ui.sel === t.id;
    return `<button data-action="sel" data-id="${esc(t.id)}" ${t.disabled ? 'disabled' : ''}
      class="rounded-xl px-3 py-3.5 text-center font-bold border transition ${sel ? 'bg-red-600/30 border-red-400 ring-2 ring-red-400' : 'bg-slate-800 border-slate-700 hover:bg-slate-700'} ${t.abstain ? 'col-span-2' : ''}">
      ${esc(t.name)}</button>`;
  }).join('');
  return `<div class="${CARD}">
    ${opts.hint ? `<div class="text-sm text-slate-300 mb-3">${opts.hint}</div>` : ''}
    <div class="grid grid-cols-2 gap-2 mb-3">${tiles}</div>
    <button data-action="confirm" ${ui.sel ? '' : 'disabled'} class="${BTN_P}">${opts.confirm}</button>
  </div>`;
}

function hostControls(buttons) {
  if (!isHost()) return `<div class="text-center text-sm text-slate-400 py-2">بانتظار الهوست…</div>`;
  return `<div class="${CARD}"><div class="text-xs text-slate-400 mb-2">👑 أدوات الهوست</div>${buttons}</div>`;
}

/* ---------- الردهة ---------- */
function lobbyView() {
  const host = isHost();
  const n = S.players.length;
  const list = S.players.map(p => `<div class="flex items-center justify-between rounded-xl px-3 py-2 mb-1.5 bg-slate-800/70">
      <span>${esc(p.name)}${p.id === pid ? ' <span class="text-xs text-slate-400">(أنت)</span>' : ''}${p.id === S.hostId ? ' 👑' : ''}</span>
      ${host && p.id !== pid ? `<button data-action="kick" data-id="${esc(p.id)}" class="text-red-400 px-2">✕</button>` : ''}
    </div>`).join('');
  return `
  <div class="${CARD} text-center">
    <div class="text-slate-400 text-sm">كود الغرفة</div>
    <div class="text-6xl font-black my-2 font-mono tracking-[.3em]" style="direction:ltr">${esc(S.code)}</div>
    <div class="text-xs text-slate-400">شارك هذا الكود مع اللاعبين ليدخلوا</div>
  </div>
  <div class="${CARD}"><div class="font-bold mb-2">اللاعبون (${n})</div>${list}
    <div class="text-xs text-slate-500 mt-2">الحد الأدنى ${MIN_PLAYERS} لاعبين، والأقصى ${MAX_PLAYERS}.</div></div>
  ${host ? `<div class="${CARD}">
      <button data-action="addbot" class="${BTN_S} mb-2" ${n >= MAX_PLAYERS ? 'disabled' : ''}>🤖 إضافة بوت</button>
      <button data-action="start" class="${BTN_P}" ${n < MIN_PLAYERS ? 'disabled' : ''}>ابدأ اللعبة</button>
      ${n < MIN_PLAYERS ? `<div class="text-xs text-amber-300 mt-2 text-center">تحتاج ${MIN_PLAYERS - n} لاعب/بوت إضافي للبدء</div>` : ''}
      <button data-action="closeroom" class="${BTN_S} mt-2 !text-red-300">إنهاء الغرفة</button>
    </div>` : waitingBox('بانتظار الهوست لبدء اللعبة…')}`;
}

/* ---------- توزيع الأدوار ---------- */
function rolesView() {
  const mafiaCount = S.players.filter(p => p.role === 'mafia').length;
  return `
  <div class="${CARD} text-center">
    <div class="text-5xl mb-2">🎴</div>
    <div class="font-bold text-lg mb-1">تم توزيع الأدوار!</div>
    <div class="text-sm text-slate-400">اضغط على بطاقتك لكشف دورك لمدة 5 ثوانٍ ثم يُخفى تلقائياً. لا تدع أحداً يرى شاشتك.</div>
    <div class="text-xs text-slate-500 mt-3">عدد المافيا: ${mafiaCount} · طبيب: 1 · محقق: 1 · مدنيون: ${S.players.length - mafiaCount - 2}</div>
  </div>
  ${hostControls(`<button data-action="beginnight" class="${BTN_P}">🌙 ابدأ الليلة الأولى</button>`)}`;
}

/* ---------- الليل ---------- */
function nightView() {
  const me = meOf();
  const alive = alivePlayers();
  let main;
  if (!me || !me.alive) main = spectatorBox('الليل يخيّم… راقب بصمت.');
  else if (S.night.done.includes(pid)) main = waitingBox('تم تسجيل اختيارك. بانتظار البقية…');
  else {
    const role = ROLES[me.role];
    const targets = alive.map(p => ({
      id: p.id, name: p.name + (p.id === pid ? ' (أنت)' : ''),
      disabled: (me.role === 'mafia' && p.role === 'mafia') || (me.role !== 'doctor' && p.id === pid)
    }));
    main = `<div class="${CARD} text-center"><div class="text-4xl mb-1">🌙</div><div class="font-bold text-lg">حلّ الليل</div>
        <div class="text-xs text-slate-400 mt-1">يختار الجميع لاعباً ثم يؤكدون، حتى لا يُعرف من يملك دوراً خاصاً.</div></div>` +
      pickerHtml(targets, { hint: `<span class="opacity-80">${role.hint}</span>`, confirm: '✅ تأكيد الاختيار' });
  }
  return main + progressHtml(S.night.done, 'من أنهى الليل')
    + hostControls(`<button data-action="forcenight" class="${BTN_S}">⏭️ إنهاء الليل الآن (تخطي المنتظرين)</button>`);
}

/* ---------- النهار ---------- */
function dayView() {
  return `
  <div class="${CARD} text-center pop">
    <div class="text-5xl mb-2">☀️</div>
    <div class="font-bold text-lg leading-8">${esc(S.announce)}</div>
    <div class="text-sm text-slate-400 mt-2">ناقشوا من تشكّون به، ثم يبدأ الهوست التصويت.</div>
  </div>
  ${statusList()}
  ${hostControls(`<button data-action="beginvote" class="${BTN_P}">🗳️ ابدأ التصويت</button>`)}`;
}

/* ---------- التصويت ---------- */
function voteView() {
  const me = meOf();
  const alive = alivePlayers();
  let main;
  if (!me || !me.alive) main = spectatorBox('يصوّت الأحياء الآن.');
  else if (S.votes.done.includes(pid)) main = waitingBox('تم تسجيل صوتك. بانتظار البقية…');
  else {
    const targets = alive.filter(p => p.id !== pid).map(p => ({ id: p.id, name: p.name }));
    targets.push({ id: 'abstain', name: '🏳️ امتناع عن التصويت', abstain: true });
    main = `<div class="${CARD} text-center"><div class="text-4xl mb-1">🗳️</div><div class="font-bold text-lg">من تريد إقصاءه؟</div>
        <div class="text-xs text-slate-400 mt-1">الأصوات سرية. يُقصى صاحب الأغلبية الواضحة فقط.</div></div>` +
      pickerHtml(targets, { hint: '', confirm: '✅ تأكيد صوتي' });
  }
  return main + progressHtml(S.votes.done, 'من صوّت')
    + hostControls(`<button data-action="forcevote" class="${BTN_S}">⏭️ إنهاء التصويت الآن (غير المصوّتين = امتناع)</button>`);
}

function voteResultView() {
  const r = S.voteResult || { counts: {}, abstain: 0, eliminated: null };
  const rows = Object.keys(r.counts).sort((a, b) => r.counts[b] - r.counts[a]).map(id => {
    const p = S.players.find(x => x.id === id);
    return `<div class="flex justify-between rounded-xl px-3 py-2 mb-1.5 bg-slate-800/70"><span>${esc(p ? p.name : '؟')}</span><span class="font-bold">${r.counts[id]} صوت</span></div>`;
  }).join('') || '<div class="text-slate-400 text-sm">لا توجد أصوات ضد أحد.</div>';
  let verdict;
  if (r.eliminated) {
    const v = S.players.find(p => p.id === r.eliminated);
    verdict = `⚖️ تم إقصاء <b>${esc(v.name)}</b><br>كان دوره: ${ROLES[v.role].e} ${ROLES[v.role].n}`;
  } else verdict = '🤝 لم يُقصَ أحد (تعادل أو أغلبية امتناع)';
  return `
  <div class="${CARD} text-center pop"><div class="text-5xl mb-2">⚖️</div><div class="font-bold text-lg leading-8">${verdict}</div></div>
  <div class="${CARD}"><div class="font-bold mb-2 text-sm text-slate-300">فرز الأصوات</div>${rows}
    <div class="flex justify-between rounded-xl px-3 py-2 bg-slate-800/40 text-slate-300"><span>🏳️ امتناع</span><span class="font-bold">${r.abstain}</span></div></div>
  ${statusList()}
  ${hostControls(`<button data-action="beginnight" class="${BTN_P}">🌙 ابدأ الليل التالي</button>`)}`;
}

/* ---------- نهاية اللعبة ---------- */
function gameoverView() {
  const me = meOf();
  const mine = me && me.role === 'mafia' ? 'mafia' : 'civilians';
  const won = S.winner === mine;
  const title = S.winner === 'mafia' ? '🦹‍♂️ فازت المافيا!' : '🏆 فاز المدنيون!';
  const rows = S.players.map(p => `<div class="flex items-center justify-between rounded-xl px-3 py-2 mb-1.5 bg-slate-800/70">
      <span class="${p.alive ? '' : 'line-through opacity-70'}">${p.alive ? '🟢' : '💀'} ${esc(p.name)}</span>
      <span class="text-sm ${p.role ? ROLES[p.role].c : ''}">${p.role ? ROLES[p.role].e + ' ' + ROLES[p.role].n : ''}</span></div>`).join('');
  return `
  <div class="${CARD} text-center pop">
    <div class="text-6xl mb-2">${won ? '🎉' : '😔'}</div>
    <div class="text-2xl font-black mb-1">${title}</div>
    <div class="text-slate-400 text-sm">${won ? 'مبروك، فريقك انتصر!' : 'حظاً أوفر في الجولة القادمة.'}</div>
  </div>
  <div class="${CARD}"><div class="font-bold mb-2 text-sm text-slate-300">كشف جميع الأدوار</div>${rows}</div>
  ${hostControls(`<button data-action="newgame" class="${BTN_P}">🔄 لعبة جديدة بنفس اللاعبين</button>`)}`;
}

/* ---------- بطاقة الدور السري ---------- */
function roleCardHtml() {
  const me = meOf(); if (!me || !me.role) return '';
  const r = ROLES[me.role];
  const now = Date.now();
  const detBtn = me.role === 'detective'
    ? `<button data-action="notebook" class="${BTN_S} mt-2">📒 دفتر التحقيقات (${((S.notes && S.notes[pid]) || []).length})</button>` : '';
  if (ui.revealUntil > now) {
    const elapsed = Math.max(0, 5 - (ui.revealUntil - now) / 1000);
    const mates = me.role === 'mafia' ? S.players.filter(p => p.role === 'mafia' && p.id !== pid).map(p => esc(p.name)) : [];
    return `<div class="${CARD} text-center pop border-amber-600/60">
      <div class="text-6xl mb-1">${r.e}</div>
      <div class="text-2xl font-black ${r.c}">${r.n}</div>
      <div class="text-sm text-slate-300 mt-2 leading-6">${r.d}</div>
      ${mates.length ? `<div class="text-sm text-red-300 mt-2">شركاؤك في المافيا: ${mates.join('، ')}</div>` : ''}
      <div class="h-1.5 bg-slate-800 rounded-full overflow-hidden mt-3"><div class="h-full bg-amber-400" style="animation:shrink 5s linear forwards;animation-delay:-${elapsed.toFixed(2)}s"></div></div>
      <div class="text-xs text-slate-500 mt-1">سيُخفى تلقائياً</div>
    </div>${detBtn}`;
  }
  return `<button data-action="reveal" class="${BTN_S} ${S.phase === 'roles' ? '!bg-amber-600 hover:!bg-amber-500 !text-white' : ''}">🎴 اكشف دوري السري (5 ثوانٍ)</button>${detBtn}`;
}

/* ---------- دفتر التحقيقات ---------- */
function notebookHtml() {
  const notes = (S.notes && S.notes[pid]) || [];
  const rows = notes.length ? notes.slice().reverse().map(n => `
    <div class="flex items-center justify-between rounded-xl px-3 py-2.5 mb-1.5 ${n.isMafia ? 'bg-red-900/40 border border-red-800' : 'bg-emerald-900/30 border border-emerald-800'}">
      <div><div class="font-bold">${esc(n.name)}</div><div class="text-xs text-slate-400">الليلة ${n.round}</div></div>
      <div class="font-bold">${n.isMafia ? '🦹‍♂️ مافيا' : '✅ بريء'}</div></div>`).join('')
    : '<div class="text-slate-400 text-sm text-center py-6">لا توجد تحقيقات بعد. ستظهر نتيجة كل ليلة هنا.</div>';
  return `<div class="fixed inset-0 z-40 bg-black/70 flex items-end sm:items-center justify-center p-3" data-action="notebookclose">
    <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-4 max-h-[80vh] overflow-y-auto pop" data-stop="1">
      <div class="flex items-center justify-between mb-3"><div class="font-black text-lg">📒 دفتر التحقيقات</div>
        <button data-action="notebookclose" class="w-9 h-9 rounded-lg bg-slate-800">✕</button></div>
      ${rows}
    </div></div>`;
}

/* ======================================================================
   الأحداث
   ====================================================================== */
const actions = {
  join() {
    const name = cleanName(ui.name);
    if (name.length < 2) return toast('اكتب اسمك (حرفان على الأقل)');
    if (!/^\d{4}$/.test(ui.code)) return toast('كود الغرفة يجب أن يكون 4 أرقام');
    lsSet('mafia_name', name); ui.name = name; ui.joined = false; net.tries = 0;
    sfx('click'); S = null; connect(ui.code, false);
  },
  create() {
    const name = cleanName(ui.name);
    if (name.length < 2) return toast('اكتب اسمك أولاً');
    lsSet('mafia_name', name); ui.name = name; net.tries = 0;
    sfx('click'); S = newState(rndCode(), name); ui.joined = true; ui.lastKey = '';
    connect(S.code, true); stateChanged();
  },
  demo() {
    const name = cleanName(ui.name);
    if (name.length < 2) return toast('اكتب اسمك أولاً');
    lsSet('mafia_name', name); ui.name = name; net.tries = 0;
    sfx('click'); S = newState(rndCode(), name); ui.joined = true; ui.lastKey = '';
    for (let i = 0; i < 4; i++) addBotRaw();
    startGameRaw(); S.v = 1;
    connect(S.code, true); stateChanged();
  },
  resume() {
    let s = null; try { s = JSON.parse(lsGet('mafia_session', 'null')); } catch (e) {}
    if (!s || !/^\d{4}$/.test(s.code)) return;
    if (cleanName(ui.name).length < 2) return toast('اكتب اسمك أولاً');
    S = null; ui.joined = false; connect(s.code, !!s.host);
  },
  leave() { if (isHost() && S && S.phase !== 'lobby' && !confirm('أنت الهوست. مغادرتك توقف اللعبة حتى تعود. هل تريد المغادرة؟')) return; leaveRoom(); },
  closeroom() { if (!confirm('إنهاء الغرفة وطرد الجميع؟')) return; send({ type: 'CLOSE_ROOM' }); leaveRoom(); },
  mute() { muted = !muted; lsSet('mafia_mute', muted ? '1' : '0'); if (!muted) sfx('click'); render(); },
  sel(d) { ui.sel = d.id; sfx('select'); render(); },
  confirm() {
    if (!S || !ui.sel) return;
    const phase = S.phase, target = ui.sel;
    sfx('click');
    act(phase === 'night' ? 'night' : 'vote', target);
  },
  reveal() {
    ui.revealUntil = Date.now() + 5000; sfx('reveal'); render();
    setTimeout(() => { if (Date.now() >= ui.revealUntil) { ui.revealUntil = 0; render(); } }, 5100);
  },
  notebook() { ui.notebook = true; sfx('click'); render(); },
  notebookclose() { ui.notebook = false; render(); },
  kick(d) { if (!isHost() || S.phase !== 'lobby') return; S.players = S.players.filter(p => p.id !== d.id); commit(); },
  addbot() { if (!isHost() || S.phase !== 'lobby') return; if (addBotRaw()) { sfx('click'); commit(); } },
  start() { if (!isHost()) return; if (!startGameRaw()) return toast('تحتاج ' + MIN_PLAYERS + ' لاعبين على الأقل'); commit(); },
  beginnight() { if (!isHost() || (S.phase !== 'roles' && S.phase !== 'voteResult')) return; beginNight(); },
  beginvote() { if (!isHost() || S.phase !== 'day') return; beginVote(); },
  forcenight() { if (!isHost() || S.phase !== 'night') return; resolveNight(); },
  forcevote() { if (!isHost() || S.phase !== 'vote') return; resolveVote(); },
  newgame() {
    if (!isHost() || S.phase !== 'gameover') return;
    S.players.forEach(p => { p.role = null; p.alive = true; });
    S.phase = 'lobby'; S.round = 0; S.winner = null; S.notes = {}; S.announce = '';
    S.lastNight = null; S.voteResult = null; S.night = { done: [] }; S.votes = { done: [] };
    S._host = { nightActions: {}, votes: {} };
    commit();
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const stop = e.target.closest('[data-stop]');
  if (stop && el !== stop && el.contains(stop)) return; // نقرة داخل نافذة منبثقة لا تغلقها
  ac(); // فتح السياق الصوتي بعد أول لمسة
  const fn = actions[el.dataset.action];
  if (fn) fn(el.dataset, el);
});
document.addEventListener('input', e => {
  if (e.target.id === 'nameInput') ui.name = e.target.value;
  if (e.target.id === 'codeInput') { ui.code = e.target.value.replace(/\D/g, '').slice(0, 4); e.target.value = ui.code; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'nameInput' || e.target.id === 'codeInput')) actions.join();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !net.closed && (!net.ws || net.ws.readyState > 1)) { net.retry = 0; openSocket(); }
});

/* ======================================================================
   البداية
   ====================================================================== */
render();
(function autoResume() {
  let s = null; try { s = JSON.parse(lsGet('mafia_session', 'null')); } catch (e) {}
  if (s && /^\d{4}$/.test(s.code) && cleanName(ui.name).length >= 2) {
    ui.joined = false; connect(s.code, !!s.host);
  }
})();
})();
</script>
</body>
</html>
